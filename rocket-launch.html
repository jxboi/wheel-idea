<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   CONSTANTS / TIMELINE
   ===================================================================== */
const DECK_Y = 18;                // launch table height
const TX = 17;                    // launch tower x position
const T_ION = 3.2;                // first engine ignites
const T_LIFT = 10.6;              // hold-downs released, rocket lifts
const T_END = 37.0;               // loop point
const T_FADE = 35.0;              // start of whiteout (cloud) fade
const SUN_DIR = new THREE.Vector3(-0.78, 0.58, 0.30).normalize();
const FOG_HEX = 0xbcdcf6;
const WIND = new THREE.Vector3(2.2, 0, -1.0);

// Optional URL-hash hooks for testing only: #t=<seconds> jumps ahead, #pr=<scale> fixes resolution, #freeze=1 halts the clock.
const hashParams = new URLSearchParams(location.hash.slice(1));
const START_T = parseFloat(hashParams.get('t') || '0');
const FORCE_PR = parseFloat(hashParams.get('pr') || '0');
const FREEZE = hashParams.get('freeze') === '1';

/* =====================================================================
   SMALL UTILITIES
   ===================================================================== */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rngFn(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = rngFn(20240607);
const rr = (a, b) => a + (b - a) * rnd();

function hash2(x, y) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, o = 4) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < o; i++) { s += a * vnoise(x * f + i * 17.3, y * f + i * 9.1); n += a; f *= 2; a *= 0.5; }
  return s / n;
}
function vnoiseP(x, y, p) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const m = (q) => ((q % p) + p) % p;
  const a = hash2(m(xi), m(yi)), b = hash2(m(xi + 1), m(yi)), c = hash2(m(xi), m(yi + 1)), d = hash2(m(xi + 1), m(yi + 1));
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbmP(x, y, p, o = 4) {
  let s = 0, a = 0.5, n = 0, f = 1;
  for (let i = 0; i < o; i++) { s += a * vnoiseP(x * f, y * f, p * f); n += a; f *= 2; a *= 0.5; }
  return s / n;
}
const shake1 = (t, s) => Math.sin(t * 37.1 + s) * 0.5 + Math.sin(t * 61.7 + s * 2.3) * 0.3 + Math.sin(t * 93.3 + s * 0.7) * 0.2;

const NOISE_GLSL = /* glsl */`
float h31(vec3 p){ p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3)); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float n3(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fb3(vec3 p){ return 0.55 * n3(p) + 0.3 * n3(p * 2.1 + 3.7) + 0.15 * n3(p * 4.3 + 9.1); }
`;

/* =====================================================================
   RENDERER / SCENE / CAMERA
   ===================================================================== */
const COARSE = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', stencil: false });
const maxScale = () => Math.min(window.devicePixelRatio || 1, 1.6, Math.sqrt(3.2e6 / (window.innerWidth * window.innerHeight)));
let pixelScale = FORCE_PR || maxScale();
renderer.setPixelRatio(pixelScale);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const fogColor = new THREE.Color(FOG_HEX);
scene.fog = new THREE.FogExp2(FOG_HEX, 0.00022);
scene.background = fogColor;

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 1, 42000);
camera.position.set(-64, 13, 108);

/* =====================================================================
   SKY + ENVIRONMENT LIGHTING
   ===================================================================== */
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    uSun: { value: SUN_DIR.clone() },
    uTime: { value: 0 },
    uHorizon: { value: new THREE.Color(FOG_HEX) },
    uMid: { value: new THREE.Color(0x4aa6f7) },
    uZenith: { value: new THREE.Color(0x1360e6) },
  },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: /* glsl */`
    uniform vec3 uSun, uHorizon, uMid, uZenith; uniform float uTime;
    varying vec3 vDir;
    float hh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hh(i), hh(i + vec2(1,0)), f.x), mix(hh(i + vec2(0,1)), hh(i + vec2(1,1)), f.x), f.y); }
    float fbm2(vec2 p){ return 0.5 * vn(p) + 0.25 * vn(p * 2.03 + 1.7) + 0.125 * vn(p * 4.1 + 5.3) + 0.0625 * vn(p * 8.2 + 2.9); }
    void main(){
      vec3 d = normalize(vDir);
      float y = d.y, t = clamp(y, 0.0, 1.0);
      vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.30, t));
      col = mix(col, uZenith, smoothstep(0.16, 0.9, t));
      float sd = max(dot(d, uSun), 0.0);
      col += vec3(1.0, 0.82, 0.5) * pow(sd, 5.0) * 0.18 + vec3(1.0, 0.9, 0.7) * pow(sd, 40.0) * 0.45;
      col += vec3(1.0, 0.95, 0.85) * smoothstep(0.99935, 0.9998, sd) * 14.0;
      if (y > 0.0) {
        vec2 sp = d.xz / (y + 0.14);
        float c = fbm2(sp * 1.3 + vec2(uTime * 0.004, 0.0));
        c = smoothstep(0.50, 0.82, c);
        float streak = fbm2(vec2(sp.x * 0.5 + sp.y * 2.4, sp.y * 0.4 + sp.x * 0.1) + 4.0);
        c = max(c * 0.8, smoothstep(0.55, 0.85, streak) * 0.5);
        col = mix(col, vec3(1.0), c * 0.6 * smoothstep(0.02, 0.28, y));
      }
      gl_FragColor = vec4(col, 1.0);
    }`,
  side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 48, 24), skyMat);
sky.renderOrder = -100; sky.frustumCulled = false;
scene.add(sky);

{
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(500, 48, 24), skyMat));
  // a bright, warm-green ground bounce so metals do not reflect a black floor
  const floor = new THREE.Mesh(new THREE.CircleGeometry(480, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(0.55, 0.62, 0.42, THREE.SRGBColorSpace) }));
  floor.position.y = -20;
  envScene.add(floor);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envRT = pmrem.fromScene(envScene, 0.02, 1, 2000);
  scene.environment = envRT.texture;
  pmrem.dispose();
}

const sun = new THREE.DirectionalLight(0xfff0d8, 2.7);
sun.castShadow = true;
const SM = Math.min(COARSE ? 2048 : 4096, renderer.capabilities.maxTextureSize);
sun.shadow.mapSize.set(SM, SM);
sun.shadow.camera.left = -125; sun.shadow.camera.right = 125;
sun.shadow.camera.top = 125; sun.shadow.camera.bottom = -125;
sun.shadow.camera.near = 20; sun.shadow.camera.far = 700;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.35; sun.shadow.radius = 2.2;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0x9ccaff, 0x7a8a50, 0.55));

const engineLightA = new THREE.PointLight(0xffa24a, 0, 140, 1.7);   // under the rocket
const engineLightB = new THREE.PointLight(0xff8a3a, 0, 90, 1.6);    // ground / pad bounce
scene.add(engineLightA, engineLightB);

/* =====================================================================
   TERRAIN
   ===================================================================== */
const exclusions = [];   // {x, z, r} keep vegetation clear
function blocked(x, z, extra = 0) {
  for (let i = 0; i < exclusions.length; i++) {
    const e = exclusions[i], dx = x - e.x, dz = z - e.z;
    if (dx * dx + dz * dz < (e.r + extra) * (e.r + extra)) return true;
  }
  return false;
}
const SEA_Y = -7;
function terrainHeight(x, z) {
  const r = Math.hypot(x, z);
  const far = sstep(105, 560, r);
  let h = (fbm(x * 0.0029 + 3.1, z * 0.0029 - 1.7, 5) - 0.44) * 300 * far;
  h += Math.pow(fbm(x * 0.0011 - 7, z * 0.0011 + 4, 5), 1.7) * 1500 * sstep(900, 3600, r);
  h += (fbm(x * 0.012, z * 0.012, 3) - 0.5) * 7 * far;
  const proj = x * 0.62 - z * 0.78;                       // sea lies behind-right of the pad
  const sea = sstep(1300, 2100, proj);
  h = lerp(h, -45, sea);
  return h;
}
const sRGB = (hex) => { const c = new THREE.Color(hex); return [c.r, c.g, c.b]; };
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const C_GRASS_A = sRGB(0x3fb02e), C_GRASS_B = sRGB(0x93d23a), C_FOREST = sRGB(0x159a5a), C_OCHRE = sRGB(0xe0a93a),
      C_EARTH = sRGB(0xc4562b), C_ROCK = sRGB(0x8d7fb0), C_SNOW = sRGB(0xf6f9ff), C_SAND = sRGB(0xf4dc98),
      C_DIRT = sRGB(0x9c7d52), C_MEADOW = sRGB(0xf0cf4a);
function terrainColor(x, z, h, r) {
  const n1 = fbm(x * 0.005 + 11, z * 0.005 - 3, 3);
  const n2 = fbm(x * 0.0021 - 5, z * 0.0021 + 8, 3);
  const n3 = fbm(x * 0.011 + 2, z * 0.011 + 9, 3);
  let c = mixc(C_GRASS_A, C_GRASS_B, sstep(0.3, 0.7, n1));
  c = mixc(c, C_FOREST, sstep(0.52, 0.66, n2) * 0.85);
  c = mixc(c, C_OCHRE, sstep(0.6, 0.72, n3) * 0.75);
  c = mixc(c, C_MEADOW, sstep(0.66, 0.74, fbm(x * 0.02 + 40, z * 0.02 - 14, 2)) * 0.5);
  const sl = Math.abs(terrainHeight(x + 8, z) - h) + Math.abs(terrainHeight(x, z + 8) - h);
  c = mixc(c, C_EARTH, sstep(14, 40, sl) * 0.9);
  c = mixc(c, C_ROCK, sstep(260, 520, h) * 0.9);
  c = mixc(c, C_SNOW, sstep(780, 980, h));
  c = mixc(c, C_SAND, 1 - sstep(1.5, 9, h));
  c = mixc(c, C_DIRT, (1 - sstep(48, 100, r)) * 0.9);
  return c;
}
function makeDetailTexture() {
  const S = 256, d = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const n = fbmP(x / 32, y / 32, 8, 5) * 0.65 + fbmP(x / 6, y / 6, 42, 2) * 0.35;
    const v = 170 + n * 90;
    const i = (y * S + x) * 4; d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 255;
  }
  const t = new THREE.DataTexture(d, S, S, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter;
  t.anisotropy = 8; t.needsUpdate = true;
  return t;
}
function buildTerrain() {
  const NR = 200, NS = 320, R0 = 2.5, R1 = 16000;
  const pos = new Float32Array(NR * NS * 3), col = new Float32Array(NR * NS * 3), uv = new Float32Array(NR * NS * 2);
  for (let i = 0; i < NR; i++) {
    const r = R0 * Math.pow(R1 / R0, i / (NR - 1));
    for (let j = 0; j < NS; j++) {
      const a = (j / NS) * Math.PI * 2, x = Math.cos(a) * r, z = Math.sin(a) * r;
      const h = terrainHeight(x, z), k = i * NS + j;
      pos[k * 3] = x; pos[k * 3 + 1] = h; pos[k * 3 + 2] = z;
      uv[k * 2] = x / 24; uv[k * 2 + 1] = z / 24;
      const c = terrainColor(x, z, h, r);
      col[k * 3] = c[0]; col[k * 3 + 1] = c[1]; col[k * 3 + 2] = c[2];
    }
  }
  const idx = new Uint32Array((NR - 1) * NS * 6);
  let q = 0;
  for (let i = 0; i < NR - 1; i++) for (let j = 0; j < NS; j++) {
    const a = i * NS + j, b = i * NS + (j + 1) % NS, c = (i + 1) * NS + j, d = (i + 1) * NS + (j + 1) % NS;
    idx[q++] = a; idx[q++] = b; idx[q++] = c; idx[q++] = b; idx[q++] = d; idx[q++] = c;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeVertexNormals();
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, map: makeDetailTexture(), roughness: 0.96, metalness: 0, color: new THREE.Color(1.28, 1.28, 1.28), envMapIntensity: 0.55 });
  const mesh = new THREE.Mesh(g, m);
  mesh.receiveShadow = true;
  scene.add(mesh);

  // sea
  const wave = (() => {
    const S = 256, d = new Uint8Array(S * S * 4), H = new Float32Array(S * S);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      let h = 0;
      for (let k = 1; k <= 6; k++) h += Math.sin(2 * Math.PI * (x * k * 1.3 + y * (7 - k)) / S + k * 1.7) / (k * 1.4);
      H[y * S + x] = h;
    }
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const dx = H[y * S + (x + 1) % S] - H[y * S + (x + S - 1) % S], dy = H[((y + 1) % S) * S + x] - H[((y + S - 1) % S) * S + x];
      const i = (y * S + x) * 4; d[i] = 128 + dx * 40; d[i + 1] = 128 + dy * 40; d[i + 2] = 255; d[i + 3] = 255;
    }
    const t = new THREE.DataTexture(d, S, S, THREE.RGBAFormat);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(220, 220); t.generateMipmaps = true;
    t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 8; t.needsUpdate = true;
    return t;
  })();
  const sea = new THREE.Mesh(new THREE.CircleGeometry(36000, 64).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0x14b6d6, roughness: 0.06, metalness: 0.05, normalMap: wave, normalScale: new THREE.Vector2(0.35, 0.35), envMapIntensity: 1.8 }));
  sea.position.y = SEA_Y;
  scene.add(sea);
  return { wave, sea };
}
const { wave: seaNormal } = buildTerrain();

/* =====================================================================
   MATERIAL / GEOMETRY HELPERS
   ===================================================================== */
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _UP = new THREE.Vector3(0, 1, 0), _one = new THREE.Vector3(1, 1, 1);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function beam(a, b, t) {
  const len = a.distanceTo(b);
  const g = new THREE.BoxGeometry(t, len, t);
  _q.setFromUnitVectors(_UP, new THREE.Vector3().subVectors(b, a).normalize());
  _m4.compose(new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5), _q, _one);
  g.applyMatrix4(_m4);
  return g;
}
function box(w, h, d, x = 0, y = 0, z = 0) { return new THREE.BoxGeometry(w, h, d).translate(x, y, z); }
const std = (color, rough = 0.6, metal = 0.1, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });
function addMesh(geo, mat, parent, x = 0, y = 0, z = 0, cast = true, recv = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = recv;
  parent.add(m); return m;
}
const blinkers = [];
function addBlinker(parent, x, y, z, color, rate = 1, phase = 0, size = 0.35, peak = 5) {
  const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(color) });
  const m = new THREE.Mesh(new THREE.SphereGeometry(size, 12, 8), mat);
  m.position.set(x, y, z); parent.add(m);
  blinkers.push({ mat, base: new THREE.Color(color), rate, phase, peak });
  return m;
}

function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = opts.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.anisotropy = 8; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

/* =====================================================================
   VEGETATION WIND / EXHAUST BEND (shared uniforms)
   ===================================================================== */
const blast = {
  uTime: { value: 0 }, uBlast: { value: 0 }, uWindDir: { value: new THREE.Vector2(0.9, -0.42) }, uWindAmt: { value: 1 },
};
function bendify(mat, hRef, amp) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, blast);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uTime; uniform float uBlast; uniform vec2 uWindDir; uniform float uWindAmt;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        {
          #ifdef USE_INSTANCING
          vec3 iBase = instanceMatrix[3].xyz;
          mat3 im = mat3(instanceMatrix);
          float s2 = dot(im[0], im[0]);
          float sc = sqrt(s2);
          #else
          vec3 iBase = vec3(0.0); mat3 im = mat3(1.0); float s2 = 1.0; float sc = 1.0;
          #endif
          float hf = clamp(position.y / ${hRef.toFixed(2)}, 0.0, 1.0); hf *= hf;
          vec2 rel = iBase.xz;
          float d = length(rel);
          vec2 dir = rel / max(d, 0.001);
          float bl = uBlast * (1.6 * exp(-d * 0.013) + 0.18);
          float flut = sin(uTime * 15.0 + iBase.x * 0.93 + iBase.z * 1.31 + position.y * 2.3);
          float push = bl * (1.0 + 0.35 * flut);
          float gust = 0.10 + 0.07 * sin(uTime * 1.3 + iBase.x * 0.05 + iBase.z * 0.04) + 0.04 * sin(uTime * 2.9 + iBase.z * 0.11);
          vec2 offXZ = dir * push * ${amp.toFixed(2)} + uWindDir * gust * uWindAmt;
          float vsag = length(offXZ) * 0.35;
          vec3 offW = vec3(offXZ.x, -vsag, offXZ.y) * hf * sc;
          transformed += (transpose(im) * offW) / s2;
        }`);
  };
  mat.customProgramCacheKey = () => 'bend' + hRef + '_' + amp;
  return mat;
}

/* =====================================================================
   PAD, LAUNCH TABLE, TOWER, ARMS, CLAMPS
   ===================================================================== */
const padGroup = new THREE.Group();
scene.add(padGroup);

function padTexture() {
  return canvasTex(1536, 1536, (g, W, H) => {

function rocketTexture(circ, height, opts) {
  const ppm = 34, W = Math.round(circ * ppm), H = Math.round(height * ppm);
  const make = (bump) => {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = bump ? '#8c8c8c' : '#f6f8fb'; g.fillRect(0, 0, W, H);
    if (!bump) {
      const gr = g.createLinearGradient(0, 0, 0, H);
      gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.8, 'rgba(120,115,110,0.0)'); gr.addColorStop(1, 'rgba(70,60,52,0.5)');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(80,90,110,${Math.random() * 0.06})`; g.fillRect(Math.random() * W, Math.random() * H, 3 + Math.random() * 14, 1 + Math.random() * 3); }
      for (const b of opts.bands || []) {
        g.fillStyle = b.color; g.fillRect(0, b.y * H, W, b.h * H);
      }
      if (opts.checker) {
        const { y, rows } = opts.checker, sq = ppm * 1.2;
        for (let r = 0; r < rows; r++) for (let x = 0; x < W / sq; x++) {
          g.fillStyle = (x + r) % 2 ? '#14161a' : '#f6f8fb'; g.fillRect(x * sq, y * H + r * sq, sq + 0.5, sq + 0.5);
        }
      }
      if (opts.emblem) {
        const cx = W / 2, cy = opts.emblem * H, rad = opts.emblemR * ppm;
        g.save(); g.translate(cx, cy);
        g.fillStyle = '#ff6a1a'; g.beginPath(); g.arc(0, 0, rad * 1.14, 0, 7); g.fill();
        g.fillStyle = '#1456c9'; g.beginPath(); g.arc(0, 0, rad, 0, 7); g.fill();
        g.fillStyle = '#ffffff'; g.beginPath();
        for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? rad * 0.36 : rad * 0.82; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
        g.closePath(); g.fill();
        g.restore();
      }
    }
    // panel seams
    g.strokeStyle = bump ? '#2a2a2a' : 'rgba(60,72,92,0.6)'; g.lineWidth = bump ? 3 : 2;
    const rowH = ppm * 4.5, colW = ppm * 2.6;
    let row = 0;
    for (let y = 0; y <= H; y += rowH, row++) {
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
      const off = (row % 2) * colW * 0.5;
      for (let x = off; x < W; x += colW) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + rowH); g.stroke(); }
      for (let x = off; x < W; x += colW / 4) { g.fillStyle = bump ? '#505050' : 'rgba(60,70,90,0.75)'; g.fillRect(x, y - 1, 2, 2); g.fillRect(x, y + 6, 2, 2); }
    }
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = bump ? THREE.NoColorSpace : THREE.SRGBColorSpace; t.anisotropy = 8;
    t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping; t.offset.set(0.5, 0);
    return t;
  };
  return { map: make(false), bump: make(true) };
}

  const pts = [];
  for (let i = 0; i <= seg; i++) {

  return new THREE.LatheGeometry(pts, 56);
}

function makePuffAtlas() {
  const T = 512, S = T * 2, data = new Uint8Array(S * S * 4);

      const u = (x + 0.5) / T * 2 - 1, v = (y + 0.5) / T * 2 - 1;
      let d = 0;
      for (const [bx, by, br] of blobs) { const q = 1 - ((u - bx) * (u - bx) + (v - by) * (v - by)) / (br * br); if (q > 0) d += q * q; }

      const rad = Math.hypot(u, v);
      h *= 1 - sstep(0.62, 0.98, rad);
      hgt[y * T + x] = clamp(h, 0, 1);
    }
    for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) {
      const h = hgt[y * T + x];
      const hx = hgt[y * T + Math.min(T - 1, x + 1)] - hgt[y * T + Math.max(0, x - 1)];
      const hy = hgt[Math.min(T - 1, y + 1) * T + x] - hgt[Math.max(0, y - 1) * T + x];
      let nx = -hx * 9, ny = -hy * 9; const l = Math.hypot(nx, ny); if (l > 1) { nx /= l; ny /= l; }
      const i = ((oy + y) * S + ox + x) * 4;
      data[i] = 128 + nx * 127; data[i + 1] = 128 + ny * 127;

}

  engineLightB.position.set(0, 4, 0);
  engineLightB.intensity = 1500 * I * (1 - sstep(10, 170, alt));
  glowSprite.position.set(0, exitY - 3, 0); glowSprite.scale.setScalar(40 * I * (1 + 0.5 * sstep(0, 800, alt)) + 0.001); glowSprite.visible = I > 0.01 || tt < 0.05;
  glowCore.position.set(0, exitY - 1.5, 0); glowCore.scale.setScalar(12 * I + 0.001); glowCore.visible = I > 0.01 || tt < 0.05;
  const gg = I * (1 - sstep(8, 80, alt));
  groundGlow.material.opacity = gg; groundGlow.visible = gg > 0.01 || tt < 0.05;
  groundGlow.scale.setScalar(0.8 + 1.1 * thr);

  // nozzle heat glow
  nozzleMat.emissive.setRGB(1.2 * I, 0.38 * I * I, 0.05 * I);

  // --- environmental reaction
  const bl = clamp(thr * (1 - sstep(20, 200, alt)), 0, 1.2);
  blast.uTime.value = tt; blast.uBlast.value = bl;
  blast.uWindAmt.value = 1 + 2 * bl;
  seaNormal.offset.set(tt * 0.004, tt * 0.0025);

  // flags
  for (const f of flags) {
    const dist = Math.hypot(f.x, f.z), ux = f.x / dist, uz = f.z / dist;
    const wx = WIND.x * 0.5 + ux * bl * 60 * Math.exp(-dist / 58) + 0.0, wz = WIND.z * 0.5 + uz * bl * 60 * Math.exp(-dist / 58);
    const target = Math.atan2(-wz, wx);
    let da = target - f.ang; da = Math.atan2(Math.sin(da), Math.cos(da)); f.ang += da * Math.min(1, dt * 4);
    f.pivot.rotation.y = f.ang;
    const strength = clamp(Math.hypot(wx, wz) / 12, 0.1, 1.4), p = f.mesh.geometry.attributes.position, s = 1 + 3 * bl;
    for (let i = 0; i < p.count; i++) {
      const bx = f.base[i * 3], by = f.base[i * 3 + 1], u = (bx + 2.5) / 5;
      p.setZ(i, Math.sin(u * 7 - tt * (3.5 + 11 * bl)) * 0.55 * u * strength * (0.6 + 0.4 * s) + Math.sin(by * 3 + tt * 2) * 0.05 * u);
      p.setY(i, by - u * u * 0.15 * strength);
    }
    p.needsUpdate = true;
  }

  // blinkers
  for (const b of blinkers) {
    const s = Math.max(0, Math.sin(tt * b.rate * 4 + b.phase * 6.28)); const k = 0.15 + b.peak * Math.pow(s, 5);
    b.mat.color.copy(b.base).multiplyScalar(k);
  }

  // --- particles
  puffMat.uniforms.uEngW.value.set(0, Math.max(2.5, exitY - 16), 0);
  puffMat.uniforms.uEngI.value = I * 0.8;
  const g = 1 - sstep(25, 200, alt);
  emitSmoke(dt, tt, alt, thr, g);
  prevExitY = exitY;
  stepPuffs(dt, tt);
  stepSparks(dt);
  stepDebris(dt);
  stepLoose(dt, bl, tt);

  // --- camera
  const fovT = cameraTarget(tt, alt);
  if (!camSmooth.init) { camSmooth.pos.copy(desiredPos); camSmooth.look.copy(desiredLook); camSmooth.fov = fovT; camSmooth.init = true; }
  const k = 1 - Math.exp(-dt / (tt < T_LIFT ? 0.12 : 0.22));
  camSmooth.pos.lerp(desiredPos, k); camSmooth.look.lerp(desiredLook, k); camSmooth.fov += (fovT - camSmooth.fov) * k;
  pointer.sx += (pointer.x - pointer.sx) * (1 - Math.exp(-dt / 0.5)); pointer.sy += (pointer.y - pointer.sy) * (1 - Math.exp(-dt / 0.5));
  camera.position.copy(camSmooth.pos);
  camera.lookAt(camSmooth.look);
  // parallax
  _rx.set(1, 0, 0).applyQuaternion(camera.quaternion); _ry.set(0, 1, 0).applyQuaternion(camera.quaternion);
  camera.position.addScaledVector(_rx, pointer.sx * 3.2).addScaledVector(_ry, -pointer.sy * 1.8);
  // shake: ignition rumble + liftoff burst
  const shakeAmp = (tt < T_LIFT ? 0.04 + 0.5 * Math.pow(sstep(T_ION + 1, T_LIFT, tt), 2) * thr : 0.1) +
    (tt > T_LIFT ? 1.15 * Math.exp(-(tt - T_LIFT) / 2.4) * sstep(0, 0.4, tt - T_LIFT) : 0) + 0.0;
  const sa = shakeAmp * (1 - sstep(60, 400, alt));
  camera.position.x += shake1(tt, 0.3) * 0.5 * sa; camera.position.y += shake1(tt * 1.1, 2.2) * 0.4 * sa; camera.position.z += shake1(tt, 5.1) * 0.3 * sa;
  camera.rotateZ(shake1(tt, 8.1) * 0.0035 * sa); camera.rotateX(shake1(tt, 1.9) * 0.0025 * sa); camera.rotateY(shake1(tt, 6.4) * 0.0025 * sa);
  camera.fov = (camSmooth.fov + 1.0 * sa) * (1 + 0.32 * clamp(1 - camera.aspect, 0, 1));
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);

  // atmosphere: thinner haze with altitude
  const camAlt = camera.position.y;
  const fd = lerp(0.00022, 0.00016, sstep(100, 1600, camAlt));
  scene.fog.density = fd; puffMat.uniforms.uFogDens.value = fd;
  skyMat.uniforms.uTime.value = tt;
  sky.position.copy(camera.position); sky.scale.setScalar(30);

  // shadows follow the action
  const follow = sstep(T_LIFT, T_LIFT + 5, tt);
  const tgt = _tmp2.set(0, lerp(44, DECK_Y + alt + 24, follow), 0);
  const sn = snapShadow(tgt);
  sun.target.position.copy(sn);
  sun.position.copy(sn).addScaledVector(SUN_DIR, 320);
  sun.target.updateMatrixWorld();

  // light direction for billboards in view space
  puffMat.uniforms.uLight.value.copy(SUN_DIR).transformDirection(camera.matrixWorldInverse);

  // heat shimmer screen positions
  const hv = tt > T_ION + 0.5 ? Math.min(1, thr * 1.5) : 0;
  const p0 = _tmp2.set(0, exitY + 3, 0);
  const ok0 = toUV(p0, heatPass.uniforms.uP0.value);
  const plumeLen = flameVis * 1.3;
  toUV(_tmp2.set(0, exitY - plumeLen, 0), heatPass.uniforms.uP1.value);
  _rx.set(1, 0, 0).applyQuaternion(camera.quaternion);
  const e0 = new THREE.Vector2(); toUV(_tmp2.set(0, exitY, 0).addScaledVector(_rx, 7), e0);
  const wpx = Math.abs(e0.x - heatPass.uniforms.uP0.value.x) * (window.innerWidth / window.innerHeight);
  heatPass.uniforms.uW0.value = wpx * 1.4; heatPass.uniforms.uW1.value = wpx * (2.4 + 0.45 * flameVis / 21);
  heatPass.uniforms.uStrength.value = ok0 ? hv * (0.6 + 0.4 * Math.min(1, LS * 0.5)) : 0;
  toUV(_tmp2.set(0, 2, 0), heatPass.uniforms.uG.value);
  const e1 = new THREE.Vector2(); toUV(_tmp2.set(0, 2, 0).addScaledVector(_rx, 30), e1);
  heatPass.uniforms.uWG.value = Math.abs(e1.x - heatPass.uniforms.uG.value.x) * (window.innerWidth / window.innerHeight);
  heatPass.uniforms.uStrengthG.value = hv * (1 - sstep(10, 100, alt)) * 0.9;
  heatPass.uniforms.uTime.value = tt;

  // whiteout fades (start of loop + inside the high cloud at the end)
  const fadeIn = 1 - sstep(0.0, 1.6, tt);
  const fadeOut = sstep(T_FADE, T_END - 0.05, tt);
  gradePass.uniforms.uFade.value = Math.max(fadeIn, fadeOut);
  gradePass.uniforms.uTime.value = tt;
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last = performance.now(), fpsAcc = 0, fpsN = 0, scaleCooldown = 3;
resize();
resetSim();
function fastForward(target) {
  const h = 1 / 30;
  let acc = 0;
  while (acc + h < target) { update(h); acc += h; }
  update(target - acc);
}
window.__rocket = {
  fastForward, get T() { return T; }, setScale(s) { pixelScale = s; resize(); },
  bench(n = 60) {
    const t0 = performance.now();
    for (let i = 0; i < n; i++) { update(1 / 60); flushPuffs(T); }
    return { cpuMsPerFrame: (performance.now() - t0) / n, calls: renderer.info.render.calls, tris: renderer.info.render.triangles, puffs: pool.geo.instanceCount };
  },
};
if (START_T > 0) { T = 0; fastForward(START_T); }
else update(0.0001);

function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.max(0, (now - last) / 1000); last = now;
  const dt = Math.min(raw, 1 / 20);
  if (!FREEZE) update(dt);
  flushPuffs(T);
  composer.render();

  // adaptive resolution keeps the animation smooth on slower GPUs
  if (!FORCE_PR) {
    fpsAcc += raw; fpsN++; scaleCooldown -= raw;
    if (fpsN >= 45) {
      const avg = fpsAcc / fpsN; fpsAcc = 0; fpsN = 0;
      if (scaleCooldown <= 0) {
        if (avg > 0.026 && pixelScale > 0.7) { pixelScale = Math.max(0.7, pixelScale * 0.85); resize(); scaleCooldown = 1.5; }
        else if (avg < 0.0185 && pixelScale < maxScale() - 0.02) { pixelScale = Math.min(maxScale(), pixelScale * 1.1); resize(); scaleCooldown = 4; }
      }
    }
  }
}
requestAnimationFrame(frame);
</script>
