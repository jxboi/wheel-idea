<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   UTILITIES
   ===================================================================== */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = (t) => t * t * (3 - 2 * t);
function rngFn(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = rngFn(1789);
const rr = (a, b) => a + (b - a) * rnd();

function h2(x, y, s) {
  let h = Math.imul(x + s * 57, 374761393) ^ Math.imul(y - s * 31, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
// value noise that tiles with integer periods px, py
function vn2(x, y, px, py, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const mx = (q) => ((q % px) + px) % px, my = (q) => ((q % py) + py) % py;
  const a = h2(mx(xi), my(yi), s), b = h2(mx(xi + 1), my(yi), s), c = h2(mx(xi), my(yi + 1), s), d = h2(mx(xi + 1), my(yi + 1), s);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm2(x, y, px, py, o = 3, s = 0) {
  let sum = 0, a = 0.5, n = 0, f = 1;
  for (let i = 0; i < o; i++) { sum += a * vn2(x * f, y * f, px * f, py * f, s + i * 7); n += a; f *= 2; a *= 0.5; }
  return sum / n;
}
const hexRGB = (hex) => [(hex >> 16) & 255, (hex >> 8) & 255, hex & 255];

/* =====================================================================
   PROCEDURAL TEXTURES (all drawn with canvas / typed arrays, no files)
   ===================================================================== */
function toTexture(canvas, srgb = true) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = 8;
  return t;
}
function heightCanvas(h, S) {
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S);
  for (let i = 0; i < S * S; i++) { const v = clamp(h[i], 0, 1) * 255; img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255; }
  g.putImageData(img, 0, 0);
  return c;
}

// weathered planking: growth rings, knots, pits, scratches and grime
function makeWood(seed, lo, hi) {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S), hm = new Float32Array(S * S);
  const rn = rngFn(seed), L = hexRGB(lo), H = hexRGB(hi);
  const knots = Array.from({ length: 4 }, () => ({ x: rn() * S, y: rn() * S, r: 22 + rn() * 34 }));
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S;
    let ph = u * 11 + (fbm2(u * 6, v * 2, 6, 2, 3, seed) - 0.5) * 5.5;
    let kn = 0, core = 0;
    for (const k of knots) {
      const d = Math.hypot(x - k.x, (y - k.y) * 0.55), R = k.r * 2.3;
      if (d < R) { const f = 1 - d / R; ph += f * f * 3.5 * Math.sin(d * 0.28); kn = Math.max(kn, f); if (d < k.r * 0.45) core = 1; }
    }
    const ring = 0.5 + 0.5 * Math.sin(ph * TAU);
    const streak = fbm2(u * 96, v * 3, 96, 3, 2, seed + 3);
    let t = 0.52 * ring + 0.48 * streak;
    t *= 1 - 0.38 * kn; if (core) t *= 0.55;
    if (streak < 0.3) t *= 0.78;
    const grime = 0.86 + 0.28 * fbm2(u * 9, v * 9, 9, 9, 3, seed + 9);
    hm[y * S + x] = t;
    const i = (y * S + x) * 4;
    img.data[i] = lerp(L[0], H[0], t) * grime; img.data[i + 1] = lerp(L[1], H[1], t) * grime; img.data[i + 2] = lerp(L[2], H[2], t) * grime; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  g.lineCap = 'round';
  for (let i = 0; i < 70; i++) {            // scratches and nicks along the grain
    const x = rn() * S, y = rn() * S, l = 10 + rn() * 70;
    g.strokeStyle = rn() < 0.5 ? 'rgba(235,205,160,0.16)' : 'rgba(30,18,8,0.28)'; g.lineWidth = 0.6 + rn() * 1.2;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rn() - 0.5) * 3, y + l); g.stroke();
  }
  const bump = heightCanvas(hm, S);
  return { map: toTexture(c), bump: toTexture(bump, false), canvas: c };
}

// chunky quarried stone: mottling, pits, cracks, speckle
function makeStone(seed) {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S), hm = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S;
    const n = fbm2(u * 6, v * 6, 6, 6, 4, seed), sp = h2(x, y, seed);
    const pit = fbm2(u * 40, v * 40, 40, 40, 2, seed + 5) < 0.3 ? 0.78 : 1;
    const t = (0.35 + 0.65 * n) * pit * (0.93 + 0.1 * sp);
    hm[y * S + x] = t;
    const w = fbm2(u * 4, v * 4, 4, 4, 2, seed + 11);
    const i = (y * S + x) * 4, k = t * 215;
    img.data[i] = k * (0.98 + 0.08 * w); img.data[i + 1] = k * (0.95 + 0.04 * w); img.data[i + 2] = k * (0.88 - 0.04 * w); img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const rn = rngFn(seed);
  g.lineCap = 'round';
  for (let i = 0; i < 16; i++) {            // hairline cracks
    let x = rn() * S, y = rn() * S;
    g.strokeStyle = 'rgba(30,26,22,0.45)'; g.lineWidth = 0.8 + rn();
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 8; k++) { x += (rn() - 0.5) * 26; y += rn() * 22; g.lineTo(x, y); }
    g.stroke();
  }
  return { map: toTexture(c), bump: toTexture(heightCanvas(hm, S), false) };
}

// hammered iron: only a bump map; colour comes from the material
function makeHammered(seed) {
  const S = 256, hm = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S;
    hm[y * S + x] = 0.55 * fbm2(u * 14, v * 14, 14, 14, 3, seed) + 0.45 * Math.abs(vn2(u * 30, v * 30, 30, 30, seed + 2) - 0.5) * 2;
  }
  return toTexture(heightCanvas(hm, S), false);
}

// deck boards: planks cut out of a wood texture with dark seams and nail heads
function makeDeck(srcCanvas) {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), rn = rngFn(77), n = 9, w = S / n;
  for (let i = 0; i < n; i++) {
    g.drawImage(srcCanvas, rn() * 200, rn() * 200, 140, 512, i * w, 0, w, S);
    g.fillStyle = `rgba(${rn() < 0.5 ? '0,0,0' : '255,230,190'},${0.05 + rn() * 0.12})`; g.fillRect(i * w, 0, w, S);
    g.fillStyle = 'rgba(20,12,6,0.85)'; g.fillRect(i * w - 1.5, 0, 3, S);
    for (const y of [28, S - 28, S * 0.5]) { g.fillStyle = 'rgba(20,14,10,0.75)'; g.beginPath(); g.arc(i * w + w * 0.3, y + rn() * 3, 2.2, 0, TAU); g.arc(i * w + w * 0.7, y + rn() * 3, 2.2, 0, TAU); g.fill(); }
  }
  for (let i = 0; i < 6; i++) { g.fillStyle = 'rgba(20,12,6,0.55)'; g.fillRect(0, rn() * S, S, 2.5); }
  return toTexture(c);
}

function makeGrass() {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S;
    const n = fbm2(u * 8, v * 8, 8, 8, 4, 5), m = fbm2(u * 3, v * 3, 3, 3, 2, 9), b = h2(x, y, 3);
    const i = (y * S + x) * 4, t = 0.65 + 0.5 * n;
    img.data[i] = (74 + 40 * m) * t * (0.95 + 0.1 * b); img.data[i + 1] = (150 + 30 * m) * t * (0.95 + 0.1 * b); img.data[i + 2] = (52 + 10 * m) * t; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const rn = rngFn(4);
  for (let i = 0; i < 70; i++) {            // tiny meadow flowers
    g.fillStyle = ['#fff3c4', '#ffd2e0', '#ffffff', '#ffe27a'][i % 4]; g.beginPath(); g.arc(rn() * S, rn() * S, 1.6 + rn() * 1.4, 0, TAU); g.fill();
  }
  return toTexture(c);
}

function makeFlag() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 160;
  const g = c.getContext('2d');
  g.fillStyle = '#16161a'; g.fillRect(0, 0, 256, 160);
  g.fillStyle = 'rgba(70,60,50,0.35)';
  for (let i = 0; i < 160; i++) g.fillRect(Math.random() * 256, Math.random() * 160, 3, 2);
  g.fillStyle = '#efe7d2'; g.strokeStyle = '#efe7d2'; g.lineCap = 'round'; g.lineWidth = 9;
  for (const s of [-1, 1]) { g.beginPath(); g.moveTo(128 - s * 50, 118); g.lineTo(128 + s * 50, 52); g.stroke(); }
  for (const s of [-1, 1]) for (const e of [-1, 1]) { g.beginPath(); g.arc(128 + s * 54 + 0, e > 0 ? 54 : 116, 7, 0, TAU); g.fill(); }
  g.beginPath(); g.ellipse(128, 70, 26, 28, 0, 0, TAU); g.fill();
  g.fillRect(114, 88, 28, 16);
  g.fillStyle = '#16161a';
  g.beginPath(); g.ellipse(118, 70, 7, 8, 0, 0, TAU); g.ellipse(138, 70, 7, 8, 0, 0, TAU); g.fill();
  g.beginPath(); g.moveTo(128, 78); g.lineTo(123, 89); g.lineTo(133, 89); g.fill();
  for (let x = 118; x <= 138; x += 5) g.fillRect(x, 95, 1.6, 9);
  const t = toTexture(c); t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; return t;
}

function makeSoft(stops) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  for (const [p, col] of stops) gr.addColorStop(p, col);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return toTexture(c);
}
function makePuff() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), rn = rngFn(12);
  for (let i = 0; i < 16; i++) {
    const a = rn() * TAU, d = rn() * 26, r = 20 + rn() * 22;
    const gr = g.createRadialGradient(64 + Math.cos(a) * d, 64 + Math.sin(a) * d, 0, 64 + Math.cos(a) * d, 64 + Math.sin(a) * d, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  }
  return toTexture(c);
}
function makeStar() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.2, 'rgba(255,226,150,0.9)'); gr.addColorStop(0.55, 'rgba(255,140,40,0.35)'); gr.addColorStop(1, 'rgba(255,90,10,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  g.translate(64, 64);
  for (let i = 0; i < 8; i++) { g.rotate(TAU / 8); g.fillStyle = 'rgba(255,220,150,0.55)'; g.beginPath(); g.moveTo(0, -4); g.lineTo(62, 0); g.lineTo(0, 4); g.fill(); }
  return toTexture(c);
}
function makeBullseye() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#7a5230'; g.fillRect(0, 0, 128, 128);
  ['#f2ead6', '#d8352b', '#f2ead6', '#d8352b', '#f2ead6'].forEach((col, i) => { g.fillStyle = col; g.beginPath(); g.arc(64, 64, 58 - i * 11, 0, TAU); g.fill(); });
  return toTexture(c);
}

/* =====================================================================
   RENDERER / SCENE / CAMERA
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xf3dcb8), ZENITH = new THREE.Color(0x3f93e0), MID = new THREE.Color(0x9ccbef);
const SUN_DIR = new THREE.Vector3(-0.55, 0.62, 0.58).normalize();
scene.fog = new THREE.Fog(0xe9d6b6, 55, 210);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1500);
camera.position.set(12.6, 11.4, 15.4);

/* ---------- sky + environment ---------- */
const skyMat = new THREE.ShaderMaterial({
  uniforms: { uSun: { value: SUN_DIR }, uH: { value: HORIZON }, uM: { value: MID }, uZ: { value: ZENITH } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: `
    uniform vec3 uSun, uH, uM, uZ; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir); float t = clamp(d.y, 0.0, 1.0);
      vec3 col = mix(uH, uM, smoothstep(0.0, 0.22, t)); col = mix(col, uZ, smoothstep(0.15, 0.9, t));
      float s = max(dot(d, uSun), 0.0);
      col += vec3(1.0, 0.8, 0.5) * pow(s, 6.0) * 0.28 + vec3(1.0, 0.9, 0.7) * pow(s, 60.0) * 0.5;
      col += vec3(1.0, 0.96, 0.85) * smoothstep(0.9993, 0.9998, s) * 10.0;
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
  side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 40, 20), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false; scene.add(sky);
{
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 40, 20), skyMat));
  const gnd = new THREE.Mesh(new THREE.CircleGeometry(90, 24).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x6e8a4a }));
  gnd.position.y = -3; envScene.add(gnd);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(envScene, 0.02, 1, 400).texture;
  pm.dispose();
}

/* ---------- lights ---------- */
const sun = new THREE.DirectionalLight(0xffe6c2, 3.1);
sun.position.copy(SUN_DIR).multiplyScalar(40);
sun.target.position.set(0, 3.5, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 5, far: 90 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; sun.shadow.radius = 3;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xbcd9ff, 0x8f7a52, 0.65));
const flashLight = new THREE.PointLight(0xffa850, 0, 24, 1.6); scene.add(flashLight);
const lanternLight = new THREE.PointLight(0xffb561, 4, 9, 1.8); scene.add(lanternLight);

/* =====================================================================
   MATERIALS
   ===================================================================== */
const woodA = makeWood(11, 0x4a2e1a, 0xa8743f), woodB = makeWood(29, 0x3a2414, 0x82592f);
const stone = makeStone(5), hammered = makeHammered(3), deckTex = makeDeck(woodA.canvas);
const matWood1 = new THREE.MeshStandardMaterial({ map: woodA.map, bumpMap: woodA.bump, bumpScale: 2.2, vertexColors: true, roughness: 0.84 });
const matWood2 = new THREE.MeshStandardMaterial({ map: woodB.map, bumpMap: woodB.bump, bumpScale: 2.2, vertexColors: true, roughness: 0.86 });
const matStone = new THREE.MeshStandardMaterial({ map: stone.map, bumpMap: stone.bump, bumpScale: 3.0, vertexColors: true, roughness: 0.96 });
const matIron = new THREE.MeshStandardMaterial({ color: 0x24272d, bumpMap: hammered, bumpScale: 1.6, vertexColors: true, roughness: 0.48, metalness: 0.88 });
const matDeck = new THREE.MeshStandardMaterial({ map: deckTex, bumpMap: woodB.bump, bumpScale: 1.4, roughness: 0.88 });
const matWoodPlain = new THREE.MeshStandardMaterial({ map: woodB.map, bumpMap: woodB.bump, bumpScale: 2.0, roughness: 0.85 });
const matIronPlain = new THREE.MeshStandardMaterial({ color: 0x2a2d33, bumpMap: hammered, bumpScale: 1.6, roughness: 0.46, metalness: 0.9 });
const matBall = new THREE.MeshStandardMaterial({ color: 0x1b1d21, roughness: 0.35, metalness: 0.9 });
const matRope = new THREE.MeshStandardMaterial({ color: 0xb59a68, roughness: 0.95 });

/* =====================================================================
   PART BUILDER: bakes position, rounded-box UVs, worn edges, grime and
   moss into vertex colours, then merges everything per material.
   ===================================================================== */
const makeLists = () => ({ wood1: [], wood2: [], stone: [], iron: [] });
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _pv = new THREE.Vector3(), _sv = new THREE.Vector3(1, 1, 1);
const rb = (w, h, d, r = 0.05, seg = 2) => new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001));
const WEAR = { wood1: [1.55, 1.3, 1.05], wood2: [1.5, 1.28, 1.05], stone: [1.35, 1.32, 1.25], iron: [3.4, 3.4, 3.5] };
const BASE = { wood1: [1, 1, 1], wood2: [1, 1, 1], stone: [1, 1, 1], iron: [1, 1, 1] };

function part(lists, kind, geo, pos, rot = [0, 0, 0], o = {}) {
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  const P = g.attributes.position, N = g.attributes.normal, UV = g.attributes.uv, n = P.count;
  const edge = new Float32Array(n);
  const grain = o.grain || 'y', ts = o.ts || (kind === 'stone' ? [0.8, 0.8] : [0.95, 0.62]);
  const off = [rnd(), rnd()];
  for (let i = 0; i < n; i++) {
    const nx = Math.abs(N.getX(i)), ny = Math.abs(N.getY(i)), nz = Math.abs(N.getZ(i));
    edge[i] = o.noWear ? 0 : 1 - Math.max(nx, ny, nz);
    if (!o.keepUV) {                                  // box-project UVs in metres so grain stays proportional
      const dom = nx >= ny && nx >= nz ? 'x' : ny >= nz ? 'y' : 'z';
      const c = { x: P.getX(i), y: P.getY(i), z: P.getZ(i) };
      const ax = ['x', 'y', 'z'].filter((a) => a !== dom);
      let u, v;
      if (ax.includes(grain)) { v = c[grain]; u = c[ax.find((a) => a !== grain)]; } else { u = c[ax[0]]; v = c[ax[1]]; }
      UV.setXY(i, u * ts[0] + off[0], v * ts[1] + off[1]);
    }
  }
  _e.set(rot[0], rot[1], rot[2], 'YXZ'); _q.setFromEuler(_e); _pv.set(pos[0], pos[1], pos[2]);
  if (o.scale) _sv.set(o.scale[0], o.scale[1], o.scale[2]); else _sv.set(1, 1, 1);
  _m.compose(_pv, _q, _sv); g.applyMatrix4(_m);
  const col = new Float32Array(n * 3), tint = new THREE.Color(o.tint ?? 0xffffff), bright = 0.86 + rnd() * 0.26, wear = WEAR[kind], wr = o.wear ?? 1;

for (const [x, z] of [[17, -7], [-6, 17.5], [-17.5, -10]]) {
  const g = new THREE.Group(); g.position.set(x, -0.55, z); scene.add(g);
  const b = makeBarrel(); b.rotation.y = rnd() * TAU; b.position.y = -0.3; g.add(b);
  const top = new THREE.Mesh(new THREE.CircleGeometry(0.33, 20).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: bullseye, roughness: 0.8 })); top.position.y = 0.605; top.receiveShadow = true; g.add(top);
  const flagPole = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.7, 6), matIronPlain); flagPole.position.y = 0.95; g.add(flagPole);
  const pen = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.2), new THREE.MeshLambertMaterial({ color: 0xd8352b, side: THREE.DoubleSide })); pen.position.set(0.18, 1.18, 0); g.add(pen);
  targets.push({ g, home: new THREE.Vector3(x, -0.55, z), state: 'float', t: 0, vel: new THREE.Vector3(), spin: new THREE.Vector3(), phase: rnd() * 6 });
}

/* =====================================================================
   FX: smoke, muzzle flash, cannonball, splashes
   ===================================================================== */
const puffTex = makePuff(), starTex = makeStar(), dropTex = makeSoft([[0, 'rgba(255,255,255,1)'], [0.5, 'rgba(255,255,255,0.7)'], [1, 'rgba(255,255,255,0)']]);
const fx = [];
function spawnSprite(tex, pos, vel, size0, size1, life, color, op = 1, blend = THREE.NormalBlending, grav = 0, drag = 1) {
  const mat = new THREE.SpriteMaterial({ map: tex, color, transparent: true, depthWrite: false, blending: blend, opacity: op, fog: true });
  const s = new THREE.Sprite(mat); s.position.copy(pos); s.scale.setScalar(size0); scene.add(s);
  fx.push({ s, vel: vel.clone(), size0, size1, life, age: 0, op, grav, drag, spin: rr(-1, 1) });
}
function updateFX(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.age += dt;
    if (f.age >= f.life) { scene.remove(f.s); f.s.material.dispose(); fx.splice(i, 1); continue; }
    const t = f.age / f.life;
    f.vel.y -= f.grav * dt; f.vel.multiplyScalar(Math.exp(-(1 - f.drag) * 3 * dt));
    f.s.position.addScaledVector(f.vel, dt);
    f.s.scale.setScalar(lerp(f.size0, f.size1, 1 - (1 - t) * (1 - t)));
    f.s.material.opacity = f.op * (1 - t) * Math.min(1, t * 12);
    f.s.material.rotation += f.spin * dt;
  }
}
const flash = new THREE.Sprite(new THREE.SpriteMaterial({ map: starTex, color: new THREE.Color(2.4, 1.7, 1.0), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0, fog: false }));
scene.add(flash);
const ripples = [];
function splash(pos, big = 1) {
  for (let i = 0; i < 16 * big; i++) {
    const a = rnd() * TAU, sp = rr(1.5, 4.2);
    spawnSprite(dropTex, pos, new THREE.Vector3(Math.cos(a) * sp * 0.5, rr(3, 7) * big, Math.sin(a) * sp * 0.5), 0.22, 0.12, rr(0.7, 1.2), 0xffffff, 0.9, THREE.NormalBlending, 11);
  }
  for (let i = 0; i < 5; i++) spawnSprite(puffTex, pos.clone().add(new THREE.Vector3(rr(-0.3, 0.3), 0.2, rr(-0.3, 0.3))), new THREE.Vector3(rr(-0.4, 0.4), rr(1, 2.2), rr(-0.4, 0.4)), 0.8, 2.6 * big, 1.1, 0xeaf6ff, 0.6);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.6, 0.78, 36).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, depthWrite: false, fog: true }));
  ring.position.set(pos.x, -0.5, pos.z); scene.add(ring); ripples.push({ m: ring, age: 0, big });
}
function updateRipples(dt) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.age += dt; const t = r.age / 1.6;
    if (t >= 1) { scene.remove(r.m); r.m.geometry.dispose(); r.m.material.dispose(); ripples.splice(i, 1); continue; }
    r.m.scale.setScalar(1 + t * 5 * r.big); r.m.material.opacity = 0.8 * (1 - t);
  }
}
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 12), matBall); ball.castShadow = true; ball.visible = false; scene.add(ball);
const ballState = { on: false, v: new THREE.Vector3(), age: 0, T: 1.5, target: null, trail: 0 };

/* =====================================================================
   AIM / FIRE CYCLE
   ===================================================================== */
const G = 9.8, FLIGHT = 1.55, CYCLE = 7.0;
const aim = { yaw: 0.3, pitch: 0.12, fromYaw: 0.3, fromPitch: 0.12, toYaw: 0.3, toPitch: 0.12, v0: new THREE.Vector3(), p0: new THREE.Vector3(), target: null };
let cycleT = 0, targetIdx = 0, fired = false, recoilT = 99, hitDone = false, fuse = 0;
const pivotWorld = new THREE.Vector3(), tmpV = new THREE.Vector3();

function solveAim(tg) {
  tower.updateMatrixWorld(true);
  pivotWorld.set(0, DECK_Y + 0.97, 0);
  const aimPt = tg.home.clone(); aimPt.y = 0.15;
  let yaw = 0, pitch = 0.12; const v = new THREE.Vector3(), p0 = new THREE.Vector3();
  for (let it = 0; it < 4; it++) {
    const dirh = [Math.cos(yaw), -Math.sin(yaw)];
    p0.set(pivotWorld.x + dirh[0] * Math.cos(pitch) * 1.12, pivotWorld.y + Math.sin(pitch) * 1.12, pivotWorld.z + dirh[1] * Math.cos(pitch) * 1.12);
    v.set((aimPt.x - p0.x) / FLIGHT, (aimPt.y - p0.y + 0.5 * G * FLIGHT * FLIGHT) / FLIGHT, (aimPt.z - p0.z) / FLIGHT);
    yaw = Math.atan2(-v.z, v.x); pitch = Math.atan2(v.y, Math.hypot(v.x, v.z));
  }
  aim.toYaw = yaw; aim.toPitch = pitch; aim.v0.copy(v); aim.p0.copy(p0); aim.target = tg;
}
function angleDelta(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

function startCycle() {
  const tg = targets[targetIdx % targets.length]; targetIdx++;
  aim.fromYaw = aim.yaw; aim.fromPitch = aim.pitch;
  solveAim(tg);
  aim.toYaw = aim.fromYaw + angleDelta(aim.fromYaw, aim.toYaw);
  fired = false; hitDone = false; fuse = 0;
}
function fireCannon() {
  fired = true; recoilT = 0;
  tower.updateMatrixWorld(true);
  const mw = barrelPivot.localToWorld(MUZZLE.clone());
  const dir = new THREE.Vector3(Math.cos(aim.yaw) * Math.cos(aim.pitch), Math.sin(aim.pitch), -Math.sin(aim.yaw) * Math.cos(aim.pitch));
  ball.position.copy(mw); ball.visible = true; ballState.on = true; ballState.age = 0; ballState.target = aim.target;
  ballState.v.copy(aim.v0); ballState.trail = 0;
  flash.position.copy(mw).addScaledVector(dir, 0.35); flash.material.opacity = 1; flash.scale.setScalar(2.8); flash.userData.age = 0;
  flashLight.position.copy(mw).addScaledVector(dir, 0.6);
  for (let i = 0; i < 22; i++) {
    const spread = new THREE.Vector3(rr(-1, 1), rr(-0.4, 1), rr(-1, 1)).multiplyScalar(1.1);
    spawnSprite(puffTex, mw.clone().addScaledVector(dir, rr(0, 0.6)), dir.clone().multiplyScalar(rr(2.5, 8)).add(spread).add(new THREE.Vector3(1.2, 0.8, -0.4)), rr(0.5, 0.9), rr(2.6, 4.8), rr(2.4, 4.0), [0xf6f1e6, 0xd8d2c6, 0xbab4a8][i % 3], 0.85, THREE.NormalBlending, -0.25, 0.4);
  }
  for (let i = 0; i < 18; i++) spawnSprite(dropTex, mw.clone().addScaledVector(dir, 0.2), dir.clone().multiplyScalar(rr(6, 14)).add(new THREE.Vector3(rr(-2, 2), rr(-1, 3), rr(-2, 2))), 0.14, 0.04, rr(0.25, 0.55), 0xffc060, 1, THREE.AdditiveBlending, 6);
  for (let i = 0; i < 8; i++) spawnSprite(puffTex, new THREE.Vector3(rr(-1.2, 1.2), DECK_Y + 0.25, rr(-1.2, 1.2)), new THREE.Vector3(rr(-1.4, 1.4), rr(0.2, 0.7), rr(-1.4, 1.4)), 0.5, 1.9, rr(1.0, 1.7), 0xcdb898, 0.45);     // dust shaken off the deck
  shakeT = 0;
}
let shakeT = 99;
const RECOIL = 0.62;
function recoilOffset(t) {
  if (t < 0.085) return RECOIL * Math.sin((t / 0.085) * Math.PI / 2);
  const u = clamp((t - 0.085) / 2.3, 0, 1); return RECOIL * (1 - easeInOut(u));
}

function updateCycle(dt, time) {
  cycleT += dt; recoilT += dt; shakeT += dt;
  if (cycleT >= CYCLE) { cycleT -= CYCLE; startCycle(); }
  // 0 - 2.3 s: swing the turret and elevate the barrel
  const k = easeInOut(clamp(cycleT / 2.3, 0, 1));
  aim.yaw = lerp(aim.fromYaw, aim.toYaw, k); aim.pitch = lerp(aim.fromPitch, aim.toPitch, k);
  turret.rotation.y = aim.yaw;
  // 2.3 - 3.2 s: the gunner lights the fuse
  fuse = cycleT > 2.4 && cycleT < 3.2 ? 1 : 0;
  if (fuse && rnd() < dt * 40) {
    const w = barrelPivot.localToWorld(new THREE.Vector3(-0.62, 0.36, 0));
    spawnSprite(dropTex, w, new THREE.Vector3(rr(-0.6, 0.6), rr(0.8, 2.2), rr(-0.6, 0.6)), 0.13, 0.03, rr(0.15, 0.35), 0xffb04a, 1, THREE.AdditiveBlending, 3);
  }
  if (!fired && cycleT >= 3.2) fireCannon();
  // recoil along the carriage axis, wheels roll with it, barrel kicks up
  const off = recoilT < 3 ? recoilOffset(recoilT) : 0;
  gun.position.x = -off;
  for (const w of wheels) w.rotation.z = off / 0.28;
  const kick = recoilT < 1.4 ? 0.09 * Math.exp(-recoilT * 3.2) * Math.sin(Math.min(recoilT, 0.12) / 0.12 * Math.PI / 2) : 0;
  barrelPivot.rotation.z = aim.pitch + kick;
  // flash decay
  if (flash.material.opacity > 0) { flash.userData.age += dt; const a = flash.userData.age; flash.material.opacity = Math.max(0, 1 - a / 0.16); flash.scale.setScalar(2.8 + a * 6); flash.material.rotation = a * 4; }
  flashLight.intensity = flash.material.opacity > 0 ? 260 * flash.material.opacity : 0;
  // the tower shudders a touch
  const s = shakeT < 0.9 ? Math.exp(-shakeT * 6) : 0;
  tower.rotation.z = Math.sin(shakeT * 55) * 0.0035 * s; tower.rotation.x = Math.cos(shakeT * 47) * 0.003 * s;
  // cannonball
  if (ballState.on) {
    ballState.age += dt; ballState.v.y -= G * dt; ball.position.addScaledVector(ballState.v, dt);
    ballState.trail += dt;
    if (ballState.trail > 0.035) { ballState.trail = 0; spawnSprite(puffTex, ball.position, new THREE.Vector3(rr(-0.2, 0.2), rr(0, 0.3), rr(-0.2, 0.2)), 0.35, 1.2, 1.1, 0xe8e2d6, 0.4); }
    if (ballState.age >= FLIGHT) {
      ballState.on = false; ball.visible = false;
      const tg = ballState.target; const p = tg.home.clone(); p.y = -0.45;
      splash(p, 1.4);
      tg.state = 'hit'; tg.t = 0; tg.vel.set(rr(-2, 2), 6.5, rr(-2, 2)); tg.spin.set(rr(-6, 6), rr(-4, 4), rr(-6, 6));
    }
  }
}
function updateTargets(dt, time) {
  for (const tg of targets) {
    tg.t += dt;
    if (tg.state === 'float') {
      tg.g.position.y = tg.home.y + Math.sin(time * 1.6 + tg.phase) * 0.07;
      tg.g.rotation.x = Math.sin(time * 1.3 + tg.phase) * 0.06; tg.g.rotation.z = Math.cos(time * 1.1 + tg.phase) * 0.06;
      tg.g.scale.setScalar(Math.min(1, tg.g.scale.x + dt * 1.2));
    } else if (tg.state === 'hit') {
      tg.vel.y -= G * 0.9 * dt; tg.g.position.addScaledVector(tg.vel, dt);
      tg.g.rotation.x += tg.spin.x * dt; tg.g.rotation.y += tg.spin.y * dt; tg.g.rotation.z += tg.spin.z * dt;
      if (tg.g.position.y < -0.45 && tg.vel.y < 0) { tg.state = 'sunk'; tg.t = 0; splash(new THREE.Vector3(tg.g.position.x, -0.45, tg.g.position.z), 0.8); }
    } else if (tg.state === 'sunk') {
      tg.g.scale.setScalar(Math.max(0.001, 1 - tg.t * 3));
      if (tg.t > 2.4) { tg.g.position.copy(tg.home); tg.g.rotation.set(0, rnd() * TAU, 0); tg.g.scale.setScalar(0.001); tg.state = 'float'; }
    }
  }
}

/* =====================================================================
   CONTROLS, RESIZE, MAIN LOOP
   ===================================================================== */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5.3, 0);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 7; controls.maxDistance = 38;
controls.maxPolarAngle = Math.PI * 0.49; controls.minPolarAngle = 0.15;
controls.autoRotate = true; controls.autoRotateSpeed = 0.55;
controls.enablePan = false;
let idleTimer = 0;
renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; idleTimer = 0; });
renderer.domElement.addEventListener('wheel', () => { controls.autoRotate = false; idleTimer = 0; }, { passive: true });
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
let time = 0;
// start mid-cycle so the first moments already show the cannon moving
startCycle(); cycleT = 0.2;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  updateCycle(dt, time); updateFX(dt); updateRipples(dt); updateTargets(dt, time);
  waterMat.uniforms.uTime.value = time; foamMat.uniforms.uTime.value = time; grassUniforms.uTime.value = time;
  // flag ripple streaming away from the pole
  const fp = flagGeo.attributes.position;
  for (let i = 0; i < fp.count; i++) {
    const bx = flagBase[i * 3], by = flagBase[i * 3 + 1], u = (bx + 1.05) / 2.1;
    fp.setZ(i, Math.sin(u * 7 - time * 5 + by * 1.5) * 0.22 * u + Math.sin(u * 3 - time * 2.4) * 0.1 * u);
    fp.setY(i, by - u * u * 0.12 + Math.sin(u * 5 - time * 4) * 0.03 * u);
  }
  fp.needsUpdate = true; flagGeo.computeVertexNormals();
  // lantern sway + flicker
  lantern.rotation.z = Math.sin(time * 1.4) * 0.07 + (shakeT < 1.2 ? Math.sin(shakeT * 18) * 0.12 * Math.exp(-shakeT * 3) : 0);
  lantern.rotation.x = Math.cos(time * 1.1) * 0.05;
  lanternLight.position.copy(lantern.localToWorld(new THREE.Vector3(0, -0.47, 0)));
  lanternLight.intensity = 3.6 + Math.sin(time * 17) * 0.35 + Math.sin(time * 41) * 0.2;
  // gentle auto orbit that resumes after a pause
  if (!controls.autoRotate) { idleTimer += dt; if (idleTimer > 9) controls.autoRotate = true; }
  sky.position.copy(camera.position);
  controls.update();
  renderer.render(scene, camera);
}
frame();
// small hook for testing / screenshots
window.__tower = {
  camera, controls, setCycle(t) { cycleT = t; }, get cycleT() { return cycleT; },
  advance(sec) { for (let t = 0; t < sec; t += 1 / 30) { time += 1 / 30; updateCycle(1 / 30, time); updateFX(1 / 30); updateRipples(1 / 30); updateTargets(1 / 30, time); } },
  get stats() { return { fx: fx.length, ripples: ripples.length, targets: targets.map((t) => t.state), calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; },
};
</script>
</body>
